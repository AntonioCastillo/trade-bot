# Configuración del bot. Los secretos van en .env, aquí solo parámetros.

mode: live           # paper | live. El arranque en run.py confirma si live
exchange: kucoin

timeframe: 4h          # por defecto 4h
lookback: 300          # nº de velas a mantener para los indicadores

# LA HIDRA MULTICABEZA: cada cabeza especializada en su régimen y sus símbolos.
universe:
  # 🟢 Tendencia Alcista (ruptura del máximo de 55 días en las monedas grandes)
  # Sustituye desde 2026-10-04 a breakout_diario y momentum_diario. Pensada para
  # acompañar mercados alcistas: sin venta parcial, objetivo lejano y trailing ancho.
  # Mediciones y reservas en docs/AUDIT_2026-10.md (sección 6, punto 5).
  - name: tendencia_alcista
    symbols: [BTC/USDT, BNB/USDT, SOL/USDT]
    strategy: breakout
    timeframe: 1d
    params:
      lookback: 55
      bidirectional: false
      min_bb_width: 0.02
    macro_btc_filter: true
    risk:
      stop_loss_pct: 0.06              # cada stop cuesta ~1.2% del equity con tamaño 20%
      take_profit_pct: 0.50
      trailing_stop_pct: 0.15          # trailing FIJO desde el máximo (sin ATR)
      position_size_pct: 0.20

  # 🟢 Explosión de Volumen (Detecta entradas de dinero institucional)
  # Ampliada el 2026-10-04 con las 5 monedas que quedaron libres (docs/AUDIT_2026-10.md, 6.3).
  # ATOM, ALGO y ETC también figuran en reversion_rango (desactivada): no reactivar aquella sin quitarlas de aquí.
  - name: volumen_explosivo
    symbols: [ETH/USDT, SUI/USDT, ADA/USDT, AVAX/USDT, ATOM/USDT, ALGO/USDT, ETC/USDT]
    strategy: volume_surge
    timeframe: 4h
    macro_btc_filter: true
    strong_close_filter: true
    params:
      vol_period: 20
      surge_mult: 2.5
      min_change_pct: 0.01
    risk:
      stop_loss_pct: 0.06
      take_profit_pct: 0.20
      trailing_stop_pct: 0.08           # trailing FIJO del 8% (el ATR x3 en 4h quedaba a ~4-5% y cortaba pronto)
      partial_take_profit_pct: 0.05
      use_atr_trailing: false
      atr_trailing_mult: 3.0
      volatility_sizing: true
      position_size_pct: 0.15

  # ⚪ Rango Lateral (Reversión a la media en Bollinger con filtro ADX <= 25)
  # DESACTIVADA desde 2026-10-04: resta en los dos tramos de la validación desde 2022
  # (docs/AUDIT_2026-10.md, sección 6.2). Para reactivarla: enabled: true.
  - name: reversion_rango
    enabled: false
    symbols: [ATOM/USDT, ALGO/USDT, ETC/USDT]
    strategy: range_reversion
    timeframe: 4h
    macro_btc_filter: true
    params:
      adx_period: 14
      adx_max: 25.0
      rsi_period: 14
      rsi_oversold: 30.0
      rsi_overbought: 70.0
      bb_period: 20
      bb_std: 2.0
      bidirectional: false
    risk:
      stop_loss_pct: 0.05
      take_profit_pct: 0.10
      trailing_stop_pct: 0.03
      position_size_pct: 0.20

  # 🟢 Rejilla de Acumulación (Grid Trading en 4h con filtro ADX)
  - name: grid_lateral
    symbols: [NEAR/USDT, LINK/USDT, DOT/USDT, LTC/USDT]
    strategy: grid
    timeframe: 4h
    macro_btc_filter: true
    # Reglas de pausa (2026-10-04): solo bloquean entradas nuevas; lo abierto se sigue gestionando.
    strike_pause:                      # 3 stops con pérdida en 7 días -> 30 días sin abrir
      strikes: 3
      window_days: 7
      pause_days: 30
    paused_while_open: [tendencia_alcista]   # no abre mientras la cabeza alcista tenga posiciones
    params:
      range_period: 100
      levels: 10
      adx_period: 14
      adx_max: 25.0
      bidirectional: false
    risk:
      stop_loss_pct: 0.05
      take_profit_pct: 0.025
      position_size_pct: 0.12
      max_concurrent_per_symbol: 3

  # 🟢 Caza de Pánicos (Capitulación / Comprar caídas extremas con RSI < 20)
  - name: capitulacion
    symbols: [XRP/USDT, DOGE/USDT, TRX/USDT, UNI/USDT]
    strategy: capitulation
    timeframe: 4h
    macro_btc_filter: true            # restaurado: sin el filtro perdía fuera de muestra (2022), ver AUDIT 6.2
    params:
      rsi_period: 14
      rsi_oversold: 20.0
      lookback: 20
      drop_pct: 0.05
      volume_mult: 2.0
    risk:
      stop_loss_pct: 0.05
      take_profit_pct: 0.15
      trailing_stop_pct: 0.03
      position_size_pct: 0.20

risk:
  quote_currency: USDT
  starting_balance: 480.00      # saldo real de cuenta
  position_size_pct: 0.20       # tamaño base por operación (20% = ~$96 USD)
  max_open_positions: 8         # capacidad para 4 posiciones direccionales + niveles de grid
  stop_loss_pct: 0.05
  take_profit_pct: 0.03
  max_daily_loss_pct: 0.10      # cortafuegos diario (10%)
  max_account_drawdown_pct: 0.15 # disyuntor global de cuenta (cierre de emergencia al 15%)
  max_total_exposure_pct: 0.80   # reserva mínima del 20% en USDT líquido
  exposure_on_equity: true       # el tope se mide sobre el equity total, no sobre el USDT libre

engine:
  poll_interval_seconds: 60     # ciclo cada 60s
  exit_poll_seconds: 10         # entre ciclos, comprobar las salidas de las posiciones abiertas cada 10s
  fee_pct: 0.0010              # comisión spot estándar (0.1%)
  slippage_pct: 0.0005          # deslizamiento estimado
  report_interval_seconds: 900  # informe cada 15 min
  alive_interval_seconds: 21600 # señal de vida a Telegram (6 h)
  error_notify_interval_seconds: 1800

sniper:
  enabled: false

carry:
  enabled: false                              # DESACTIVADO: 100% liquidez asignada a Spot (mayor ROI)
  funding_radar_enabled: true                 # RADAR ACTIVO: escanea tasas extremas e informa por Telegram
  radar_min_annualized_pct: 25.0              # Notificar si el funding anualizado supera el 25% anual
  symbols: [ETH/USDT, SOL/USDT]              # las 2 con más volumen de futuros en KuCoin
  notional_pct: 0.15                          # 15% del balance por posición (por pata)
  min_annualized_pct: 25.0                    # umbral de apertura
  exit_annualized_pct: 0.0                    # cerrar si funding cae a negativo
  poll_interval_seconds: 300                  # chequear cada 5 min
  fee_pct: 0.0008                             # comisión aprox. por pata
  leverage: 1.0                               # 1x = riesgo mínimo de liquidación
  max_notional_usdt: 0.0                      # 0.0 = 100% dinámico por notional_pct y margen en futuros
  liquidation_buffer_pct: 0.15                # cierre de emergencia si queda a <15% de la liquidación

xsmom:
  enabled: false                # APAGADO: la Hidra multicabeza de arriba controla la cuenta

hedging:
  enabled: false

storage:
  db_path: data/tradebot.db

logging:
  level: INFO
