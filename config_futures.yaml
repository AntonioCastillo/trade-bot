# Configuración del bot para Futuros Perpetuos con Cobertura y Cortos.

mode: live           # paper | live
exchange: kucoinfutures

timeframe: 4h
lookback: 300

# Cobertura dinámica de Beta (no aplica a XSMom)
hedging:
  enabled: false

universe: []

risk:
  quote_currency: USDT
  starting_balance: 483.90
  position_size_pct: 0.08
  max_open_positions: 10
  stop_loss_pct: 0.05
  take_profit_pct: 0.03
  max_daily_loss_pct: 0.20
  max_account_drawdown_pct: 0.15

engine:
  poll_interval_seconds: 60
  fee_pct: 0.0004               # comisión de futuros promedio (paper)
  slippage_pct: 0.0005
  report_interval_seconds: 900
  alive_interval_seconds: 21600
  error_notify_interval_seconds: 1800

sniper:
  enabled: false

carry:
  enabled: false

xsmom:
  enabled: true
  universe: [BTC/USDT, ETH/USDT, BNB/USDT, ADA/USDT, SOL/USDT, AVAX/USDT, LINK/USDT, LTC/USDT, XRP/USDT, DOGE/USDT, NEAR/USDT]
  lookback_days: 30
  top_k: 3
  rebalance_days: 7
  trend_filter: true
  trend_symbol: BTC/USDT
  trend_sma: 200
  fee_pct: 0.0004               # comisión promedio de futuros
  leverage: 2.0                 # apalancamiento 2x para eficiencia de margen
  max_notional_usdt: 100.0      # límite duro en USDT por posición
  liquidation_buffer_pct: 0.15  # buffer de seguridad para evitar liquidación (cierre al 15%)
  poll_interval_seconds: 3600

storage:
  db_path: data/tradebot_futures.db

logging:
  level: INFO
